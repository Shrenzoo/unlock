<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="none">
  <defs>
    <!-- Connected currents, with a broad body and finer light following each bend. -->
    <path id="current" d="M410-190C325-10 460 90 610 175S810 285 670 350 395 365 345 450 465 565 650 625 980 735 1175 660 1515 645 1780 765"/>
    <path id="return" d="M-180 670C70 450 285 480 490 635S795 820 1030 715 1420 680 1790 625"/>
    <path id="tributary" d="M1460-180C1605 15 1240 80 1340 230S1710 335 1650 505 1440 675 1180 660"/>
    <path id="body-return" d="M-180 620C80 438 300 455 508 620 690 765 788 802 1004 706 1230 603 1450 650 1780 580L1790 650C1430 748 1260 706 1060 785 815 885 660 810 450 690 270 565 55 530-160 735Z"/>
    <linearGradient id="body" x1=".15" y1="0" x2=".72" y2="1">
      <stop stop-color="#1243ce"/><stop offset=".25" stop-color="#0049f5"/>
      <stop offset=".52" stop-color="#0563ff"/><stop offset=".74" stop-color="#003ee2"/><stop offset="1" stop-color="#0756ee"/>
    </linearGradient>
    <linearGradient id="light" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#81c7ff" stop-opacity=".15"/><stop offset=".3" stop-color="#459bff" stop-opacity=".75"/>
      <stop offset=".55" stop-color="#9cdeff" stop-opacity=".48"/><stop offset=".8" stop-color="#288aff" stop-opacity=".8"/><stop offset="1" stop-color="#84cfff" stop-opacity=".1"/>
    </linearGradient>
    <filter id="bloom" x="-25%" y="-30%" width="150%" height="160%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="34"/></filter>
    <filter id="body-soft" x="-15%" y="-20%" width="130%" height="140%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".004 .009" numOctaves="2" seed="13" result="flow"/>
      <feDisplacementMap in="SourceGraphic" in2="flow" scale="22" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="diffuse" x="-15%" y="-20%" width="130%" height="140%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="9"/></filter>
  </defs>
  <g fill="none" stroke-linecap="round">
    <g stroke="#1764ff" filter="url(#bloom)" opacity=".38">
      <use href="#current" stroke-width="195"/><use href="#return" stroke-width="230"/>
      <use href="#tributary" stroke-width="155"/>
    </g>
    <g fill="url(#body)" filter="url(#body-soft)">
      <use href="#body-return"/>
    </g>
    <g stroke="url(#body)" filter="url(#body-soft)">
      <use href="#current" stroke-width="90"/>
      <use href="#tributary" stroke-width="72" opacity=".78"/>
    </g>
    <!-- Unequal, offset veils avoid a uniform neon-tube outline. -->
    <g stroke="url(#light)" filter="url(#diffuse)">
      <path d="M415-160C355 5 495 115 625 183S780 275 654 327 375 360 326 455 488 595 685 640 980 716 1170 641 1515 615 1780 748" stroke-width="28" opacity=".28"/>
      <path d="M-170 681C80 485 285 490 482 653S795 839 1038 736 1425 704 1780 641" stroke-width="22" opacity=".34"/>
      <path d="M1465-160C1560 10 1212 80 1318 238S1690 350 1625 510 1420 660 1180 650" stroke-width="19" opacity=".24"/>
    </g>
  </g>
</svg>
