[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "unlock-engine"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["cadquery==2.6.1", "cadquery-ocp==7.8.1.1.post1", "pydantic==2.12.3", "jsonschema==4.25.1"]

[project.optional-dependencies]
test = ["pytest==8.4.2", "ruff==0.14.2"]

[project.scripts]
unlock-engine = "unlock_engine.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
