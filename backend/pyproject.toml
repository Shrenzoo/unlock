[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "unlock-engine"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["cadquery==2.6.1", "cadquery-ocp==7.8.1.1.post1", "pydantic==2.12.3", "jsonschema==4.25.1", "python-dotenv==1.1.1", "openai==2.6.1", "httpx==0.28.1", "fastapi==0.119.1", "uvicorn==0.38.0", "python-multipart==0.0.20"]

[project.optional-dependencies]
test = ["pytest==8.4.2", "ruff==0.14.2", "playwright==1.56.0"]

[project.scripts]
unlock-engine = "unlock_engine.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -m 'not meta_live and not browser and not gallery'"
markers = [
    "meta_live: explicitly enabled paid tests against direct Meta Model API",
    "browser: real-service browser acceptance (starts servers and installed Chrome)",
    "gallery: full offline run of every gallery fixture against its pre-registered outcome (~8 min)",
]
