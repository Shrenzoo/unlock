<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="100%" role="img"
     aria-label="Comparison of Muse Spark against two deterministic selectors on the same fixture, all run before the live call and unmodified">
  <defs>
    <style>
      .mono{font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace}
      @keyframes grow{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}
      @keyframes rowin{0%{opacity:0;transform:translateY(6px)}100%{opacity:1;transform:translateY(0)}}
      .bar{transform-origin:left center;animation:grow 1.1s cubic-bezier(.2,.8,.2,1) both}
      .rw{animation:rowin .5s ease-out both}
    </style>
  </defs>
  <rect width="960" height="320" fill="#151719"/>
  <text x="40" y="42" class="mono" font-size="13" fill="#3268f5">same fixture · same frozen policy · selectors ran BEFORE the live call, unmodified</text>

  <!-- column headers -->
  <g class="mono" font-size="10.5" fill="#7d8287">
    <text x="40" y="78">SELECTOR</text>
    <text x="250" y="78">OUTCOME</text>
    <text x="470" y="78">PROPOSALS</text>
    <text x="600" y="78">TOOL CALLS</text>
    <text x="740" y="78">RUNTIME</text>
    <text x="856" y="78">COST</text>
  </g>
  <line x1="40" y1="88" x2="920" y2="88" stroke="#33383d"/>

  <!-- Muse row -->
  <g class="rw" style="animation-delay:.1s">
    <rect x="34" y="98" width="892" height="50" rx="8" fill="#1a2233" stroke="#3268f5" stroke-opacity=".55"/>
    <text x="46" y="120" class="mono" font-size="12" fill="#3268f5">Muse Spark 1.3</text>
    <text x="46" y="137" class="mono" font-size="10" fill="#7d8287">live</text>
    <text x="250" y="128" class="mono" font-size="11" fill="#34866b">VERIFIED_IMPROVEMENT</text>
    <rect class="bar" x="470" y="118" width="60" height="12" rx="3" fill="#3268f5" style="animation-delay:.5s"/>
    <text x="536" y="128" class="mono" font-size="11" fill="#a5a9ad">2 / 1</text>
    <text x="600" y="128" class="mono" font-size="11" fill="#a5a9ad">6</text>
    <text x="740" y="128" class="mono" font-size="11" fill="#a5a9ad">48.1 s</text>
    <text x="856" y="128" class="mono" font-size="11" fill="#a5a9ad">$0.030</text>
  </g>

  <!-- geometry_ranked row -->
  <g class="rw" style="animation-delay:.25s">
    <text x="46" y="178" class="mono" font-size="12" fill="#e9e8e3">geometry_ranked</text>
    <text x="46" y="195" class="mono" font-size="10" fill="#7d8287">deterministic</text>
    <text x="250" y="186" class="mono" font-size="11" fill="#34866b">VERIFIED_IMPROVEMENT</text>
    <rect class="bar" x="470" y="176" width="30" height="12" rx="3" fill="#4f5357" style="animation-delay:.65s"/>
    <text x="506" y="186" class="mono" font-size="11" fill="#a5a9ad">1 / 1</text>
    <text x="600" y="186" class="mono" font-size="11" fill="#a5a9ad">2</text>
    <text x="740" y="186" class="mono" font-size="11" fill="#a5a9ad">24.1 s</text>
    <text x="856" y="186" class="mono" font-size="11" fill="#a5a9ad">$0</text>
  </g>

  <!-- stable_enumeration row -->
  <g class="rw" style="animation-delay:.4s">
    <text x="46" y="236" class="mono" font-size="12" fill="#e9e8e3">stable_enumeration</text>
    <text x="46" y="253" class="mono" font-size="10" fill="#7d8287">PRD C2 · blind</text>
    <text x="250" y="244" class="mono" font-size="11" fill="#e4602f">NO_VERIFIED_IMPROVEMENT</text>
    <rect class="bar" x="470" y="234" width="90" height="12" rx="3" fill="#4f5357" style="animation-delay:.8s"/>
    <text x="566" y="244" class="mono" font-size="11" fill="#a5a9ad">3 / 3</text>
    <text x="600" y="244" class="mono" font-size="11" fill="#a5a9ad">4</text>
    <text x="740" y="244" class="mono" font-size="11" fill="#a5a9ad">30.3 s</text>
    <text x="856" y="244" class="mono" font-size="11" fill="#a5a9ad">$0</text>
  </g>

  <!-- honest note -->
  <text x="40" y="286" class="mono" font-size="11" fill="#e4602f">Stated plainly, because our own evidence says it: Muse matched the geometry-ranked</text>
  <text x="40" y="303" class="mono" font-size="11" fill="#e4602f">selector on this fixture. It did not beat it. One run is a protocol check, not a benchmark.</text>
</svg>
