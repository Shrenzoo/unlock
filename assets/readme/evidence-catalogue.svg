<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" role="img"
     aria-label="The committed evidence tree: live run, tool smoke, frozen validation record and browser acceptance">
  <defs>
    <style>
      .mono{font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace}
      @keyframes appear{0%{opacity:0;transform:translateX(-8px)}100%{opacity:1;transform:translateX(0)}}
      @keyframes verifypulse{0%,100%{stroke-opacity:.4}50%{stroke-opacity:1}}
      @keyframes sizeflash{0%,100%{opacity:.6}50%{opacity:1}}
      .it{animation:appear .45s ease-out both}
      .vp{animation:verifypulse 3s ease-in-out infinite}
      .sz{animation:sizeflash 3.4s ease-in-out infinite}
    </style>
  </defs>
  <rect width="960" height="400" fill="#151719"/>
  <text x="40" y="36" class="mono" font-size="13" fill="#3268f5">backend/evidence/ — committed, content-addressed, reproducible</text>
  <text x="40" y="56" class="mono" font-size="10.5" fill="#7d8287">nothing here is a screenshot of a terminal someone typed figlet into</text>

  <!-- root -->
  <g class="it" style="animation-delay:.05s">
    <text x="40" y="92" class="mono" font-size="11.5" fill="#e9e8e3">evidence/</text>
  </g>

  <!-- column 1: live-b02 -->
  <g class="it" style="animation-delay:.15s">
    <text x="60" y="118" class="mono" font-size="11" fill="#3268f5">live-b02/</text>
    <text x="80" y="140" class="mono" font-size="10" fill="#e9e8e3">live_run.json</text>
    <text x="250" y="140" class="mono sz" font-size="9.5" fill="#34866b">158 KB</text>
    <text x="80" y="156" class="mono" font-size="9" fill="#7d8287">every tool response, plan, certificate, hash</text>

    <text x="80" y="178" class="mono" font-size="10" fill="#e9e8e3">live_changed_bridge.step</text>
    <text x="270" y="178" class="mono" font-size="9.5" fill="#34866b">91 KB</text>
    <text x="80" y="194" class="mono" font-size="9" fill="#7d8287">the actual constructed bracket — open it in CAD</text>

    <text x="80" y="216" class="mono" font-size="10" fill="#e9e8e3">selector_geometry_ranked.json</text>
    <text x="80" y="232" class="mono" font-size="9" fill="#7d8287">the deterministic control · matched the model</text>

    <text x="80" y="252" class="mono" font-size="10" fill="#e9e8e3">selector_stable_enumeration.json</text>
    <text x="80" y="268" class="mono" font-size="9" fill="#7d8287">the blind control · found nothing</text>

    <text x="80" y="288" class="mono" font-size="10" fill="#e9e8e3">worker_*_benchmark.jsonl</text>
    <text x="80" y="304" class="mono" font-size="9" fill="#7d8287">cold vs warm timing, measured under load</text>
  </g>

  <!-- divider -->
  <line x1="330" y1="100" x2="330" y2="330" stroke="#272b2f"/>

  <!-- column 2 -->
  <g class="it" style="animation-delay:.3s">
    <text x="350" y="118" class="mono" font-size="11" fill="#3268f5">meta-tool-smoke/</text>
    <text x="370" y="140" class="mono" font-size="10" fill="#e9e8e3">live_report.json</text>
    <text x="370" y="156" class="mono" font-size="9" fill="#7d8287">15/15 checks · key absent from report, stdout, stderr</text>

    <text x="350" y="192" class="mono" font-size="11" fill="#3268f5">browser-acceptance/</text>
    <text x="370" y="214" class="mono" font-size="10" fill="#e9e8e3">report.json</text>
    <text x="370" y="230" class="mono" font-size="9" fill="#7d8287">headless Chrome through the real HTTP service</text>
  </g>

  <line x1="600" y1="100" x2="600" y2="330" stroke="#272b2f"/>

  <!-- column 3: the frozen validation record -->
  <g class="it" style="animation-delay:.45s">
    <text x="620" y="118" class="mono" font-size="11" fill="#3268f5">meta/</text>
    <text x="640" y="140" class="mono" font-size="10" fill="#e9e8e3">final-pytest.txt</text>
    <text x="640" y="156" class="mono" font-size="9" fill="#7d8287">267 passed at freeze time</text>

    <text x="640" y="178" class="mono" font-size="10" fill="#e9e8e3">browser-compare.png</text>
    <text x="640" y="194" class="mono" font-size="9" fill="#7d8287">real browser, real backend</text>

    <text x="640" y="216" class="mono" font-size="10" fill="#e9e8e3">browser-export.png</text>
    <text x="640" y="232" class="mono" font-size="9" fill="#7d8287">real browser, real backend</text>

    <text x="640" y="254" class="mono" font-size="10" fill="#e9e8e3">checked-export.zip</text>
    <text x="810" y="254" class="mono" font-size="9.5" fill="#34866b">152 KB</text>
    <text x="640" y="270" class="mono" font-size="9" fill="#7d8287">reimported and re-verified</text>

    <text x="640" y="292" class="mono" font-size="10" fill="#e9e8e3">SHA256.json</text>
    <text x="640" y="308" class="mono" font-size="9" fill="#7d8287">every artifact, content-addressed</text>
  </g>

  <!-- the bottom band -->
  <rect class="vp" x="40" y="340" width="880" height="44" rx="9" fill="#14211c" stroke="#34866b"/>
  <text x="60" y="362" class="mono" font-size="11" fill="#34866b">Every claim in this README maps to a file above. The verification table tells you the exact jq command for each one.</text>
  <text x="60" y="377" class="mono" font-size="9.5" fill="#a5a9ad">Run them. If any output differs from what is promised, the README is wrong and we would like to know.</text>
</svg>
