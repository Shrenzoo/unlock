<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="100%" role="img"
     aria-label="Before: no supported removal route. After: a single verified Z-plus translation of 80 millimetres">
  <defs>
    <style>
      .mono{font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace}
      @keyframes block{0%,44%{opacity:1}52%,100%{opacity:.16}}
      @keyframes open {0%,48%{opacity:0;transform:scaleY(0)}58%,100%{opacity:1;transform:scaleY(1)}}
      @keyframes path {0%,62%{stroke-dashoffset:180}80%,100%{stroke-dashoffset:0}}
      @keyframes fadein{0%,66%{opacity:0}80%,100%{opacity:1}}
      .ob{animation:block 7s ease-in-out infinite}
      .cw{transform-origin:center;animation:open 7s ease-in-out infinite}
      .rt{stroke-dasharray:180;animation:path 7s ease-in-out infinite}
      .rd{animation:fadein 7s ease-in-out infinite}
    </style>
  </defs>
  <rect width="960" height="300" fill="#151719"/>

  <!-- BEFORE -->
  <text x="40" y="40" class="mono" font-size="12" fill="#e4602f">BEFORE · baseline search</text>
  <g>
    <rect x="60" y="180" width="340" height="30" rx="5" fill="#272b2f" stroke="#33383d"/>
    <rect x="170" y="140" width="120" height="40" rx="5" fill="#3268f5" opacity=".8"/>
    <text x="182" y="165" class="mono" font-size="10" fill="#f2f1ed">target</text>
    <!-- the obstruction, solid -->
    <g class="ob">
      <rect x="120" y="112" width="220" height="28" rx="4" fill="#7d8287"/>
      <text x="128" y="104" class="mono" font-size="10" fill="#a5a9ad">bridge_bracket</text>
    </g>
    <!-- blocked arrow -->
    <g class="ob">
      <path d="M230 138 V118" stroke="#e4602f" stroke-width="3"/>
      <path d="M222 126 l16 12 M238 126 l-16 12" stroke="#e4602f" stroke-width="2.5"/>
    </g>
    <text x="346" y="122" class="mono" font-size="10.5" fill="#e4602f">CONFIRMED_GEOMETRIC</text>
    <text x="346" y="136" class="mono" font-size="10.5" fill="#e4602f">OBSTRUCTION ×2</text>
    <text x="60" y="242" class="mono" font-size="12" fill="#e4602f">no_path_supported</text>
    <text x="60" y="260" class="mono" font-size="10" fill="#7d8287">complete · BRep witness at (0, −20, 36) mm</text>
    <text x="60" y="276" class="mono" font-size="10" fill="#7d8287">operation count undefined — no zero baseline invented</text>
  </g>

  <line x1="480" y1="40" x2="480" y2="280" stroke="#33383d" stroke-dasharray="4 6"/>

  <!-- AFTER -->
  <text x="520" y="40" class="mono" font-size="12" fill="#34866b">AFTER · T01 relief, verified</text>
  <g>
    <rect x="540" y="180" width="340" height="30" rx="5" fill="#272b2f" stroke="#33383d"/>
    <rect x="650" y="140" width="120" height="40" rx="5" fill="#3268f5" opacity=".8"/>
    <text x="662" y="165" class="mono" font-size="10" fill="#f2f1ed">target</text>
    <!-- bracket with relief -->
    <g class="cw">
      <path d="M600 112 h220 v28 h-60 v-28 h-100 v28 h-60 z" fill="#7d8287"/>
      <rect x="660" y="112" width="100" height="28" fill="#151719"/>
      <rect x="660" y="112" width="100" height="28" fill="none" stroke="#34866b" stroke-width="2"/>
    </g>
    <text x="730" y="104" class="mono" font-size="10" fill="#34866b">relief 40 × 16</text>
    <!-- the route -->
    <path class="rt" d="M710 138 V56" stroke="#34866b" stroke-width="3" stroke-dasharray="7 7" fill="none"/>
    <path d="M702 68 l8 -14 l8 14" fill="none" stroke="#34866b" stroke-width="3"/>
    <text x="730" y="86" class="mono" font-size="11" fill="#34866b">target TRANSLATE Z+ 80 mm</text>
    <text x="540" y="242" class="mono" font-size="12" fill="#34866b">feasible · cost (0, 0, 0, 1)</text>
    <text x="540" y="260" class="mono" font-size="10" fill="#7d8287">forward replay passed · reverse insertion passed</text>
    <text x="540" y="276" class="mono" font-size="10" fill="#7d8287">2,560 mm³ removed · 0 mm³ outside the editable web</text>
  </g>
</svg>
