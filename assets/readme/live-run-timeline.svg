<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="100%" role="img"
     aria-label="Timeline of the live B02 redesign run over 48 seconds, six turns, ending in a verified improvement">
  <defs>
    <style>
      .mono{font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace}
      @keyframes draw {0%{stroke-dashoffset:880}100%{stroke-dashoffset:0}}
      @keyframes node {0%{r:0;opacity:0}100%{r:5;opacity:1}}
      @keyframes sweep{0%{transform:translateX(0)}100%{transform:translateX(880px)}}
      .line{stroke-dasharray:880;animation:draw 5s ease-out forwards}
      .nd{animation:node .4s ease-out both}
      .head{animation:sweep 5s ease-out forwards}
    </style>
  </defs>
  <rect width="960" height="340" fill="#151719"/>
  <text x="40" y="44" class="mono" font-size="13" fill="#3268f5">live run · run_983d811a0f174f9a · muse-spark-1.3 · 48.1 s</text>
  <text x="40" y="64" class="mono" font-size="11" fill="#7d8287">6 requests · 31,122 tokens · ≈ $0.030 at list price · one authorised run, no retry</text>

  <!-- axis -->
  <line class="line" x1="60" y1="150" x2="900" y2="150" stroke="#3268f5" stroke-width="2.5"/>
  <line class="head" x1="60" y1="142" x2="70" y2="158" stroke="#f2f1ed" stroke-width="3"/>

  <!-- tick marks every ~8s -->
  <g class="mono" font-size="10" fill="#4f5357" text-anchor="middle">
    <text x="60" y="176">0s</text><text x="232" y="176">10s</text><text x="404" y="176">20s</text>
    <text x="576" y="176">30s</text><text x="748" y="176">40s</text><text x="900" y="176">48s</text>
  </g>

  <!-- events -->
  <circle class="nd" cx="185" cy="150" r="5" fill="#e4602f" style="animation-delay:.5s"/>
  <text x="185" y="118" class="mono" font-size="10.5" fill="#e4602f" text-anchor="middle">baseline</text>
  <text x="185" y="104" class="mono" font-size="10" fill="#a5a9ad" text-anchor="middle">no_path_supported</text>

  <circle class="nd" cx="290" cy="150" r="5" fill="#3268f5" style="animation-delay:1.2s"/>
  <text x="290" y="200" class="mono" font-size="10.5" fill="#3268f5" text-anchor="middle">turn 1</text>
  <text x="290" y="215" class="mono" font-size="10" fill="#a5a9ad" text-anchor="middle">inspect_blocker</text>

  <circle class="nd" cx="380" cy="150" r="5" fill="#e4602f" style="animation-delay:1.9s"/>
  <text x="380" y="118" class="mono" font-size="10.5" fill="#e4602f" text-anchor="middle">turn 2 · REFUSED</text>
  <text x="380" y="104" class="mono" font-size="10" fill="#a5a9ad" text-anchor="middle">bad citation</text>

  <circle class="nd" cx="480" cy="150" r="5" fill="#3268f5" style="animation-delay:2.6s"/>
  <text x="480" y="200" class="mono" font-size="10.5" fill="#3268f5" text-anchor="middle">turn 3</text>
  <text x="480" y="215" class="mono" font-size="10" fill="#a5a9ad" text-anchor="middle">T01 40×16 built</text>

  <circle class="nd" cx="640" cy="150" r="5" fill="#3268f5" style="animation-delay:3.3s"/>
  <text x="640" y="118" class="mono" font-size="10.5" fill="#3268f5" text-anchor="middle">turn 4</text>
  <text x="640" y="104" class="mono" font-size="10" fill="#a5a9ad" text-anchor="middle">verify_candidate</text>

  <circle class="nd" cx="745" cy="150" r="5" fill="#3268f5" style="animation-delay:3.9s"/>
  <text x="745" y="200" class="mono" font-size="10.5" fill="#3268f5" text-anchor="middle">turn 5</text>
  <text x="745" y="215" class="mono" font-size="10" fill="#a5a9ad" text-anchor="middle">compare</text>

  <circle class="nd" cx="860" cy="150" r="6" fill="#34866b" style="animation-delay:4.5s"/>
  <text x="860" y="118" class="mono" font-size="10.5" fill="#34866b" text-anchor="middle">turn 6</text>
  <text x="860" y="104" class="mono" font-size="10" fill="#34866b" text-anchor="middle">VERIFIED</text>

  <!-- result band -->
  <rect x="40" y="248" width="880" height="66" rx="11" fill="#14211c" stroke="#34866b"/>
  <text x="60" y="274" class="mono" font-size="12.5" fill="#34866b">no_path_supported  →  feasible</text>
  <text x="60" y="294" class="mono" font-size="11" fill="#a5a9ad">revised route: target TRANSLATE Z+ 80 mm · cost (0,0,0,1) · forward replay passed · reverse insertion passed</text>
  <text x="60" y="309" class="mono" font-size="10" fill="#4f5357">The model's final statement was recorded — and carried no authority over any of it.</text>
</svg>
