<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="100%" role="img"
     aria-label="Four clicks in the workspace: select the target, analyze, explore a redesign, request it">
  <defs>
    <style>
      .mono{font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace}
      @keyframes step{0%{opacity:0;transform:translateY(12px)}100%{opacity:1;transform:translateY(0)}}
      @keyframes tap{0%,100%{r:0;opacity:0}40%{r:18;opacity:.7}70%{r:26;opacity:0}}
      @keyframes caret{0%,49%{opacity:1}50%,100%{opacity:0}}
      @keyframes travel{0%{stroke-dashoffset:700}100%{stroke-dashoffset:0}}
      .st{animation:step .55s ease-out both}
      .tp{animation:tap 2.8s ease-out infinite}
      .tr{stroke-dasharray:700;animation:travel 5s linear infinite}
      .win{animation:step .6s ease-out both}
    </style>
  </defs>
  <rect width="960" height="300" fill="#151719"/>
  <text x="40" y="38" class="mono" font-size="13" fill="#3268f5">the whole demo is four clicks · open B02, pick target, run</text>

  <!-- the workspace window -->
  <g class="win" style="animation-delay:.1s">
    <rect x="40" y="58" width="440" height="196" rx="10" fill="#1d2023" stroke="#33383d"/>
    <rect x="40" y="58" width="440" height="26" rx="10" fill="#272b2f"/>
    <circle cx="58" cy="71" r="4" fill="#4f5357"/><circle cx="72" cy="71" r="4" fill="#4f5357"/><circle cx="86" cy="71" r="4" fill="#4f5357"/>
    <text x="106" y="75" class="mono" font-size="9.5" fill="#7d8287">localhost:5183/projects/b02</text>

    <!-- tree -->
    <text x="58" y="106" class="mono" font-size="10" fill="#a5a9ad">fixture_B02</text>
    <text x="72" y="124" class="mono" font-size="10" fill="#a5a9ad">├ enclosure</text>
    <text x="72" y="142" class="mono" font-size="10" fill="#3268f5">├ fan_module ◀ target</text>
    <text x="72" y="160" class="mono" font-size="10" fill="#a5a9ad">├ bridge_bracket</text>
    <text x="72" y="178" class="mono" font-size="10" fill="#a5a9ad">└ fasteners ×4</text>

    <!-- viewport hint -->
    <rect x="250" y="96" width="212" height="100" rx="7" fill="#151719" stroke="#33383d"/>
    <rect x="286" y="130" width="140" height="32" rx="5" fill="#3268f5" opacity=".75"/>
    <text x="292" y="126" class="mono" font-size="9" fill="#7d8287">fan_module</text>
    <path d="M266 118 h200" stroke="#7d8287" stroke-width="7" opacity=".55"/>
    <text x="262" y="112" class="mono" font-size="8.5" fill="#7d8287">bridge_bracket</text>

    <!-- the button -->
    <rect x="250" y="210" width="212" height="28" rx="6" fill="#2253d6"/>
    <text x="356" y="228" class="mono" font-size="10.5" fill="#f2f1ed" text-anchor="middle">Request redesign</text>
    <circle class="tp" cx="356" cy="224" fill="none" stroke="#f2f1ed" stroke-width="1.5"/>
  </g>

  <!-- the four steps -->
  <g class="mono" font-size="11">
    <g class="st" style="animation-delay:.3s">
      <circle cx="546" cy="92" r="14" fill="#151719" stroke="#3268f5" stroke-width="2"/>
      <text x="546" y="97" fill="#3268f5" text-anchor="middle" font-size="10">1</text>
      <text x="574" y="88" fill="#e9e8e3">Analyze</text>
      <text x="574" y="104" fill="#7d8287" font-size="9.5">imports the STEP, freezes the revision</text>
    </g>
    <g class="st" style="animation-delay:.55s">
      <circle cx="546" cy="140" r="14" fill="#151719" stroke="#3268f5" stroke-width="2"/>
      <text x="546" y="145" fill="#3268f5" text-anchor="middle" font-size="10">2</text>
      <text x="574" y="136" fill="#e9e8e3">Run baseline analysis</text>
      <text x="574" y="152" fill="#7d8287" font-size="9.5">no_path_supported · witness at (0,−20,36)</text>
    </g>
    <g class="st" style="animation-delay:.8s">
      <circle cx="546" cy="188" r="14" fill="#151719" stroke="#3268f5" stroke-width="2"/>
      <text x="546" y="193" fill="#3268f5" text-anchor="middle" font-size="10">3</text>
      <text x="574" y="184" fill="#e9e8e3">Explore a redesign</text>
      <text x="574" y="200" fill="#7d8287" font-size="9.5">enables the bounded model loop</text>
    </g>
    <g class="st" style="animation-delay:1.05s">
      <circle cx="546" cy="236" r="14" fill="#151719" stroke="#34866b" stroke-width="2"/>
      <text x="546" y="241" fill="#34866b" text-anchor="middle" font-size="10">4</text>
      <text x="574" y="232" fill="#34866b">Request redesign</text>
      <text x="574" y="248" fill="#7d8287" font-size="9.5">real inference · SSE stream · 48 s</text>
    </g>
  </g>

  <!-- the travelling flow line -->
  <path class="tr" d="M500 156 C 516 156, 520 92, 532 92" stroke="#3268f5" stroke-width="1.5" fill="none" opacity=".5"/>

  <text x="40" y="284" class="mono" font-size="10" fill="#4f5357">without a key the baseline is still fully viewable and redesign returns Model unavailable — it never silently falls back to mock</text>
</svg>
