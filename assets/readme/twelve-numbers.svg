<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="100%" role="img"
     aria-label="Twelve numbers: the complete finite domain from which the model may choose, and everything it may not">
  <defs>
    <style>
      .mono{font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace}
      @keyframes pop{0%{opacity:0;transform:scale(.85)}60%{transform:scale(1.06)}100%{opacity:1;transform:scale(1)}}
      @keyframes count{0%,100%{opacity:.4}50%{opacity:1}}
      @keyframes deny{0%,100%{stroke-opacity:.25}50%{stroke-opacity:.8}}
      @keyframes dashmove{0%{stroke-dashoffset:0}100%{stroke-dashoffset:-40}}
      .cell{animation:pop .45s ease-out both}
      .cn{animation:count 2.6s ease-in-out infinite}
      .dy{animation:deny 3s ease-in-out infinite}
      .dm{stroke-dasharray:6 6;animation:dashmove 4s linear infinite}
    </style>
  </defs>
  <rect width="960" height="360" fill="#151719"/>

  <text x="40" y="40" class="mono" font-size="13" fill="#3268f5">the model's entire authority over physical geometry</text>
  <text x="40" y="62" class="mono" font-size="11" fill="#7d8287">backend/src/unlock_engine/templates.py — SERVER_DOMAINS</text>

  <!-- the twelve cells -->
  <g class="mono" font-size="10" fill="#7d8287">
    <text x="40" y="92">T01 · center_x_mm</text>
    <text x="40" y="106" font-size="11.5" fill="#3268f5" class="cn">−4.0</text>
    <text x="96" y="106" font-size="11.5" fill="#3268f5" class="cn">0.0</text>
    <text x="140" y="106" font-size="11.5" fill="#3268f5" class="cn">4.0</text>

    <text x="220" y="92">center_y_mm</text>
    <text x="220" y="106" font-size="11.5" fill="#3268f5" class="cn" style="animation-delay:.15s">−24</text>
    <text x="256" y="106" font-size="11.5" fill="#3268f5" class="cn" style="animation-delay:.15s">−20</text>
    <text x="292" y="106" font-size="11.5" fill="#3268f5" class="cn" style="animation-delay:.15s">−16</text>
    <text x="328" y="106" font-size="11.5" fill="#3268f5" class="cn" style="animation-delay:.15s">0</text>

    <text x="420" y="92">width_mm</text>
    <text x="420" y="106" font-size="11.5" fill="#3268f5" class="cn" style="animation-delay:.3s">24</text>
    <text x="456" y="106" font-size="11.5" fill="#3268f5" class="cn" style="animation-delay:.3s">40</text>
    <text x="492" y="106" font-size="11.5" fill="#3268f5" class="cn" style="animation-delay:.3s">46</text>
    <text x="528" y="106" font-size="11.5" fill="#3268f5" class="cn" style="animation-delay:.3s">52</text>

    <text x="620" y="92">depth_mm</text>
    <text x="620" y="106" font-size="11.5" fill="#3268f5" class="cn" style="animation-delay:.45s">8</text>
    <text x="650" y="106" font-size="11.5" fill="#3268f5" class="cn" style="animation-delay:.45s">12</text>
    <text x="686" y="106" font-size="11.5" fill="#3268f5" class="cn" style="animation-delay:.45s">16</text>
    <text x="722" y="106" font-size="11.5" fill="#3268f5" class="cn" style="animation-delay:.45s">20</text>
  </g>

  <!-- brackets grouping each axis -->
  <path class="dy" d="M36 80 h148 M36 76 v8 M184 76 v8" stroke="#3268f5" stroke-width="1" fill="none"/>
  <path class="dy" d="M216 80 h148 M216 76 v8 M364 76 v8" stroke="#3268f5" stroke-width="1" fill="none"/>
  <path class="dy" d="M416 80 h148 M416 76 v8 M564 76 v8" stroke="#3268f5" stroke-width="1" fill="none"/>
  <path class="dy" d="M616 80 h136 M616 76 v8 M752 76 v8" stroke="#3268f5" stroke-width="1" fill="none"/>

  <!-- T02 -->
  <g class="mono">
    <text x="40" y="146" font-size="10" fill="#7d8287">T02 · offset_y_mm</text>
    <text x="40" y="162" font-size="11.5" fill="#3268f5" class="cn" style="animation-delay:.6s">−12.0</text>
    <text x="96" y="162" font-size="11.5" fill="#3268f5" class="cn" style="animation-delay:.6s">12.0</text>
    <text x="152" y="162" font-size="11.5" fill="#3268f5" class="cn" style="animation-delay:.6s">24.0</text>
    <text x="208" y="162" font-size="11.5" fill="#3268f5" class="cn" style="animation-delay:.6s">36.0</text>
    <path class="dy" d="M36 132 h200 M36 128 v8 M236 128 v8" stroke="#3268f5" stroke-width="1" fill="none"/>
  </g>

  <!-- the big count -->
  <rect x="790" y="76" width="130" height="92" rx="11" fill="#1a2233" stroke="#3268f5"/>
  <text x="855" y="126" class="mono" font-size="34" fill="#3268f5" text-anchor="middle">12</text>
  <text x="855" y="150" class="mono" font-size="9.5" fill="#a5a9ad" text-anchor="middle">numbers. that's all.</text>

  <!-- everything it may not do -->
  <text x="40" y="216" class="mono" font-size="12" fill="#e4602f">everything else is structurally unavailable</text>
  <line x1="40" y1="228" x2="920" y2="228" stroke="#33383d"/>

  <g class="mono" font-size="10.5">
    <g transform="translate(40,244)">
      <rect width="200" height="34" rx="7" fill="#1d2023" stroke="#33383d"/>
      <path class="dm" d="M10 17 h180" stroke="#e4602f" stroke-width="1.4" fill="none"/>
      <text x="100" y="21" fill="#7d8287" text-anchor="middle">arbitrary geometry</text>
    </g>
    <g transform="translate(260,244)">
      <rect width="200" height="34" rx="7" fill="#1d2023" stroke="#33383d"/>
      <path class="dm" d="M10 17 h180" stroke="#e4602f" stroke-width="1.4" fill="none"/>
      <text x="100" y="21" fill="#7d8287" text-anchor="middle">generated code</text>
    </g>
    <g transform="translate(480,244)">
      <rect width="200" height="34" rx="7" fill="#1d2023" stroke="#33383d"/>
      <path class="dm" d="M10 17 h180" stroke="#e4602f" stroke-width="1.4" fill="none"/>
      <text x="100" y="21" fill="#7d8287" text-anchor="middle">new templates</text>
    </g>
    <g transform="translate(700,244)">
      <rect width="220" height="34" rx="7" fill="#1d2023" stroke="#33383d"/>
      <path class="dm" d="M10 17 h200" stroke="#e4602f" stroke-width="1.4" fill="none"/>
      <text x="110" y="21" fill="#7d8287" text-anchor="middle">widened parameter domains</text>
    </g>
    <g transform="translate(40,290)">
      <rect width="200" height="34" rx="7" fill="#1d2023" stroke="#33383d"/>
      <path class="dm" d="M10 17 h180" stroke="#e4602f" stroke-width="1.4" fill="none"/>
      <text x="100" y="21" fill="#7d8287" text-anchor="middle">its own pass flags</text>
    </g>
    <g transform="translate(260,290)">
      <rect width="200" height="34" rx="7" fill="#1d2023" stroke="#33383d"/>
      <path class="dm" d="M10 17 h180" stroke="#e4602f" stroke-width="1.4" fill="none"/>
      <text x="100" y="21" fill="#7d8287" text-anchor="middle">out-of-domain values</text>
    </g>
    <g transform="translate(480,290)">
      <rect width="200" height="34" rx="7" fill="#1d2023" stroke="#33383d"/>
      <path class="dm" d="M10 17 h180" stroke="#e4602f" stroke-width="1.4" fill="none"/>
      <text x="100" y="21" fill="#7d8287" text-anchor="middle">shell / fs / url access</text>
    </g>
    <g transform="translate(700,290)">
      <rect width="220" height="34" rx="7" fill="#1d2023" stroke="#33383d"/>
      <path class="dm" d="M10 17 h200" stroke="#e4602f" stroke-width="1.4" fill="none"/>
      <text x="110" y="21" fill="#7d8287" text-anchor="middle">acceptance or release</text>
    </g>
  </g>

  <text x="40" y="348" class="mono" font-size="10" fill="#4f5357">The chosen relief in the live run: T01 · center_x 0.0 · center_y −20.0 · width 40.0 · depth 16.0</text>
</svg>
