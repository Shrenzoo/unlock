<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" role="img"
     aria-label="Positioning map: existing tools either trust the model blindly or refuse to use it, while UNLOCK proposes freely and verifies independently">
  <defs>
    <style>
      .mono{font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace}
      @keyframes fade{0%{opacity:0;transform:scale(.94)}100%{opacity:1;transform:scale(1)}}
      @keyframes ping{0%{r:6;opacity:.9}100%{r:26;opacity:0}}
      @keyframes blink{0%,100%{opacity:.4}50%{opacity:1}}
      .bl{animation:fade .7s ease-out both}
      .pg{animation:ping 2.6s ease-out infinite}
      .bk{animation:blink 2.2s ease-in-out infinite}
    </style>
  </defs>
  <rect width="960" height="400" fill="#151719"/>

  <!-- axes -->
  <line x1="120" y1="330" x2="880" y2="330" stroke="#33383d" stroke-width="1.5"/>
  <line x1="120" y1="330" x2="120" y2="60" stroke="#33383d" stroke-width="1.5"/>
  <text x="500" y="368" class="mono" font-size="11.5" fill="#7d8287" text-anchor="middle">how much the model is allowed to decide →</text>
  <text x="66" y="200" class="mono" font-size="11.5" fill="#7d8287" text-anchor="middle" transform="rotate(-90 66 200)">← how much is independently proven</text>

  <!-- quadrant labels -->
  <text x="150" y="86" class="mono" font-size="10.5" fill="#4f5357">CAUTIOUS / PROVEN</text>
  <text x="700" y="86" class="mono" font-size="10.5" fill="#4f5357">AMBITION / PROVEN</text>
  <text x="150" y="316" class="mono" font-size="10.5" fill="#4f5357">CAUTIOUS / UNPROVEN</text>

  <!-- existing: CAD automation, no AI -->
  <g class="bl" style="animation-delay:.1s">
    <circle cx="235" cy="118" r="9" fill="#4f5357"/>
    <text x="252" y="114" class="mono" font-size="11" fill="#a5a9ad">parametric CAD automation</text>
    <text x="252" y="130" class="mono" font-size="9.5" fill="#7d8287">proven, but can't reason about a failure</text>
  </g>

  <!-- existing: naive llm copilots -->
  <g class="bl" style="animation-delay:.25s">
    <circle cx="735" cy="288" r="9" fill="#e4602f"/>
    <text x="640" y="270" class="mono" font-size="11" fill="#e4602f">"AI copilot" for CAD</text>
    <text x="620" y="286" class="mono" font-size="9.5" fill="#7d8287">ambitious, unproven — you get</text>
    <text x="620" y="300" class="mono" font-size="9.5" fill="#7d8287">a plausible-looking STEP file</text>
  </g>

  <!-- existing: rule-based repair -->
  <g class="bl" style="animation-delay:.4s">
    <circle cx="330" cy="238" r="9" fill="#4f5357"/>
    <text x="347" y="234" class="mono" font-size="11" fill="#a5a9ad">rule-based repair scripts</text>
    <text x="347" y="250" class="mono" font-size="9.5" fill="#7d8287">hand-authored per product line</text>
  </g>

  <!-- UNLOCK -->
  <g class="bl" style="animation-delay:.55s">
    <circle class="pg" cx="806" cy="96" fill="none" stroke="#34866b" stroke-width="1.5"/>
    <circle class="pg" cx="806" cy="96" fill="none" stroke="#34866b" stroke-width="1.5" style="animation-delay:1.3s"/>
    <circle cx="806" cy="96" r="11" fill="#34866b"/>
    <text x="700" y="130" class="mono" font-size="13" fill="#34866b">UNLOCK</text>
    <text x="666" y="148" class="mono" font-size="10" fill="#a5a9ad">model proposes freely,</text>
    <text x="666" y="163" class="mono" font-size="10" fill="#a5a9ad">kernel proves independently</text>
  </g>

  <!-- the empty corner note -->
  <rect x="150" y="168" width="330" height="52" rx="9" fill="#1d2023" stroke="#e4602f" stroke-opacity=".45" class="bk"/>
  <text x="166" y="190" class="mono" font-size="10.5" fill="#e4602f">this corner was empty</text>
  <text x="166" y="208" class="mono" font-size="10" fill="#a5a9ad">high ambition + machine-checked proof, together</text>
</svg>
