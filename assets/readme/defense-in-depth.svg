<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="100%" role="img"
     aria-label="Defense in depth: six sequential gates a proposal must survive before it can affect geometry">
  <defs>
    <style>
      .mono{font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace}
      @keyframes scan{0%{transform:translateX(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateX(880px);opacity:0}}
      @keyframes gatein{0%{opacity:0;transform:translateY(14px)}100%{opacity:1;transform:translateY(0)}}
      @keyframes reject{0%,100%{opacity:.35}50%{opacity:.95}}
      @keyframes fall{0%{transform:translateY(0);opacity:1}100%{transform:translateY(26px);opacity:0}}
      .gt{animation:gatein .5s ease-out both}
      .rj{animation:reject 2.8s ease-in-out infinite}
      .beam{animation:scan 5.5s linear infinite}
    </style>
  </defs>
  <rect width="960" height="330" fill="#151719"/>
  <text x="40" y="38" class="mono" font-size="13" fill="#3268f5">defense in depth — six gates between a model token and physical geometry</text>

  <!-- the six gates -->
  <g class="mono">
    <g class="gt" style="animation-delay:.05s">
      <rect x="40" y="70" width="132" height="86" rx="9" fill="#1d2023" stroke="#33383d"/>
      <text x="106" y="94" font-size="10" fill="#3268f5" text-anchor="middle">GATE 1</text>
      <text x="106" y="112" font-size="10.5" fill="#e9e8e3" text-anchor="middle">allowlist</text>
      <text x="106" y="132" font-size="8.5" fill="#7d8287" text-anchor="middle">8 named tools</text>
      <text x="106" y="146" font-size="8.5" fill="#7d8287" text-anchor="middle">else TOOL_NOT_ALLOWED</text>
    </g>
    <g class="gt" style="animation-delay:.15s">
      <rect x="192" y="70" width="132" height="86" rx="9" fill="#1d2023" stroke="#33383d"/>
      <text x="258" y="94" font-size="10" fill="#3268f5" text-anchor="middle">GATE 2</text>
      <text x="258" y="112" font-size="10.5" fill="#e9e8e3" text-anchor="middle">schema</text>
      <text x="258" y="132" font-size="8.5" fill="#7d8287" text-anchor="middle">additionalProperties</text>
      <text x="258" y="146" font-size="8.5" fill="#7d8287" text-anchor="middle">false · typed args</text>
    </g>
    <g class="gt" style="animation-delay:.25s">
      <rect x="344" y="70" width="132" height="86" rx="9" fill="#1d2023" stroke="#33383d"/>
      <text x="410" y="94" font-size="10" fill="#3268f5" text-anchor="middle">GATE 3</text>
      <text x="410" y="112" font-size="10.5" fill="#e9e8e3" text-anchor="middle">citation</text>
      <text x="410" y="132" font-size="8.5" fill="#7d8287" text-anchor="middle">rej_ / plan_ / ver_</text>
      <text x="410" y="146" font-size="8.5" fill="#e4602f" text-anchor="middle">fired live, t=25.4s</text>
    </g>
    <g class="gt" style="animation-delay:.35s">
      <rect x="496" y="70" width="132" height="86" rx="9" fill="#1d2023" stroke="#33383d"/>
      <text x="562" y="94" font-size="10" fill="#3268f5" text-anchor="middle">GATE 4</text>
      <text x="562" y="112" font-size="10.5" fill="#e9e8e3" text-anchor="middle">domain</text>
      <text x="562" y="132" font-size="8.5" fill="#7d8287" text-anchor="middle">values inside the</text>
      <text x="562" y="146" font-size="8.5" fill="#7d8287" text-anchor="middle">finite grid</text>
    </g>
    <g class="gt" style="animation-delay:.45s">
      <rect x="648" y="70" width="132" height="86" rx="9" fill="#14211c" stroke="#34866b"/>
      <text x="714" y="94" font-size="10" fill="#34866b" text-anchor="middle">GATE 5</text>
      <text x="714" y="112" font-size="10.5" fill="#e9e8e3" text-anchor="middle">kernel build</text>
      <text x="714" y="132" font-size="8.5" fill="#7d8287" text-anchor="middle">trusted constructor</text>
      <text x="714" y="146" font-size="8.5" fill="#7d8287" text-anchor="middle">isolated worker</text>
    </g>
    <g class="gt" style="animation-delay:.55s">
      <rect x="800" y="70" width="120" height="86" rx="9" fill="#14211c" stroke="#34866b"/>
      <text x="860" y="94" font-size="10" fill="#34866b" text-anchor="middle">GATE 6</text>
      <text x="860" y="112" font-size="10.5" fill="#e9e8e3" text-anchor="middle">verifier</text>
      <text x="860" y="132" font-size="8.5" fill="#7d8287" text-anchor="middle">12 checks</text>
      <text x="860" y="146" font-size="8.5" fill="#7d8287" text-anchor="middle">replay + reverse</text>
    </g>
  </g>

  <!-- the scanning beam -->
  <line class="beam" x1="40" y1="62" x2="140" y2="62" stroke="#f2f1ed" stroke-width="2" opacity="0"/>

  <!-- where each gate's rejection lands -->
  <g class="mono" font-size="8.5">
    <text x="106" y="180" fill="#e4602f" text-anchor="middle">rejected</text>
    <text x="106" y="192" fill="#4f5357" text-anchor="middle">never dispatched</text>
    <text x="258" y="180" fill="#e4602f" text-anchor="middle">rejected</text>
    <text x="258" y="192" fill="#4f5357" text-anchor="middle">MODEL_SCHEMA_ERROR</text>
    <text x="410" y="180" fill="#e4602f" text-anchor="middle">rejected</text>
    <text x="410" y="192" fill="#4f5357" text-anchor="middle">INVALID_PROPOSAL</text>
    <text x="562" y="180" fill="#e4602f" text-anchor="middle">rejected</text>
    <text x="562" y="192" fill="#4f5357" text-anchor="middle">out of domain</text>
    <text x="714" y="180" fill="#e4602f" text-anchor="middle">rejected</text>
    <text x="714" y="192" fill="#4f5357" text-anchor="middle">CONSTRUCTION_FAILED</text>
    <text x="860" y="180" fill="#e4602f" text-anchor="middle">rejected</text>
    <text x="860" y="192" fill="#4f5357" text-anchor="middle">CONSTRAINT_FAILED</text>
  </g>
  <path class="rj" d="M40 204 H920" stroke="#e4602f" stroke-width="1" stroke-dasharray="4 6" fill="none"/>

  <!-- the summary band -->
  <rect x="40" y="222" width="880" height="86" rx="10" fill="#1d2023" stroke="#33383d"/>
  <text x="60" y="248" class="mono" font-size="11.5" fill="#e9e8e3">Gates 1–4 run before any native process starts. No geometry exists yet, so nothing can be damaged.</text>
  <text x="60" y="270" class="mono" font-size="11.5" fill="#e9e8e3">Gates 5–6 run inside isolated workers with a 30 s wall limit and no credentials in the environment.</text>
  <text x="60" y="294" class="mono" font-size="10.5" fill="#a5a9ad">Only one of the eight tools can reach gate 5 at all. Everything upstream of it is read-only inspection.</text>
</svg>
