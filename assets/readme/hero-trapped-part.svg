<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="100%" role="img"
     aria-label="A fan module trapped behind a bridge bracket; UNLOCK cuts a relief so the part lifts out">
  <defs>
    <linearGradient id="hbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151719"/><stop offset="1" stop-color="#1d2023"/>
    </linearGradient>
    <linearGradient id="brk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7d8287"/><stop offset="1" stop-color="#4f5357"/>
    </linearGradient>
    <linearGradient id="fan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3268f5"/><stop offset="1" stop-color="#2253d6"/>
    </linearGradient>
    <linearGradient id="cut" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34866b" stop-opacity="0"/>
      <stop offset=".5" stop-color="#34866b"/>
      <stop offset="1" stop-color="#34866b" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#33383d" stroke-width=".6"/>
    </pattern>
    <style>
      .mono{font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace}
      /* phase 1: the failed straight lift, forever attempted */
      @keyframes lift {
        0%,10%   { transform: translateY(0);   opacity:1 }
        30%,42%  { transform: translateY(-46px); opacity:1 }
        52%      { transform: translateY(-10px); opacity:1 }
        60%,100% { transform: translateY(0);   opacity:1 }
      }
      @keyframes shake {
        0%,29%,43%,100% { transform: translate(0,0) }
        32% { transform: translate(-3px,0) } 35% { transform: translate(3px,0) }
        38% { transform: translate(-2px,0) } 41% { transform: translate(2px,0) }
      }
      @keyframes collide { 0%,28%,44%,100%{opacity:0} 33%,39%{opacity:1} }
      /* phase 2: the relief grows, the part escapes */
      @keyframes grow  { 0%,52%{ transform:scaleY(0) } 66%,100%{ transform:scaleY(1) } }
      @keyframes escape{ 0%,66%{ transform:translateY(0); opacity:1 } 84%,100%{ transform:translateY(-96px); opacity:.25 } }
      @keyframes dash  { 0%{stroke-dashoffset:120} 100%{stroke-dashoffset:0} }
      @keyframes pulse { 0%,100%{opacity:.25} 50%{opacity:.9} }
      @keyframes fadein{ 0%,70%{opacity:0} 86%,100%{opacity:1} }
      .part{ animation: lift 9s cubic-bezier(.6,0,.4,1) infinite }
      .hit { animation: collide 9s linear infinite }
      .cut { transform-origin: 480px 232px; animation: grow 9s cubic-bezier(.7,0,.3,1) infinite }
      .esc{ transform-origin: 480px 300px; animation: escape 9s cubic-bezier(.6,0,.4,1) infinite }
      .traj{ animation: dash 9s linear infinite }
      .ok { animation: fadein 9s linear infinite }
      .pulse{ animation: pulse 2.4s ease-in-out infinite }
    </style>
  </defs>

  <rect width="960" height="420" fill="url(#hbg)"/>
  <rect width="960" height="420" fill="url(#grid)" opacity=".5"/>

  <!-- chassis -->
  <g opacity=".9">
    <rect x="300" y="300" width="360" height="46" rx="6" fill="#272b2f" stroke="#33383d"/>
    <text x="312" y="329" class="mono" font-size="12" fill="#7d8287">chassis</text>
  </g>

  <!-- the trapped fan module -->
  <g class="part">
    <g class="esc">
      <rect x="410" y="256" width="140" height="46" rx="7" fill="url(#fan)"/>
      <circle cx="440" cy="279" r="10" fill="#151719" opacity=".55"/>
      <circle cx="480" cy="279" r="10" fill="#151719" opacity=".55"/>
      <circle cx="520" cy="279" r="10" fill="#151719" opacity=".55"/>
      <text x="418" y="248" class="mono" font-size="12" fill="#a5a9ad">fan_module · target</text>
      <!-- trajectory line showing the escape route -->
      <path class="traj" d="M480 256 V130" fill="none" stroke="#34866b" stroke-width="2"
            stroke-dasharray="6 7" opacity=".85"/>
    </g>
  </g>

  <!-- collision sparks where the lift fails -->
  <g class="hit">
    <circle cx="480" cy="256" r="20" fill="none" stroke="#e4602f" stroke-width="2" class="pulse"/>
    <text x="512" y="214" class="mono" font-size="12" fill="#e4602f">blocked</text>
  </g>

  <!-- the bridge bracket: the obstruction -->
  <g>
    <path d="M340 256 h280 v-34 h-40 v-42 h-200 v42 h-40 z" fill="url(#brk)" stroke="#a9a7a0" stroke-width="1"/>
    <text x="348" y="196" class="mono" font-size="12" fill="#e9e8e3">bridge_bracket · obstruction</text>
    <!-- the relief window opens here -->
    <g class="cut">
      <rect x="410" y="180" width="140" height="76" fill="#151719"/>
      <rect x="410" y="180" width="140" height="76" fill="none" stroke="url(#cut)" stroke-width="3"/>
    </g>
  </g>

  <!-- caption -->
  <g class="ok">
    <rect x="694" y="150" width="230" height="104" rx="10" fill="#151719" stroke="#34866b" stroke-opacity=".5"/>
    <circle cx="714" cy="176" r="5" fill="#34866b"/>
    <text x="728" y="181" class="mono" font-size="13" fill="#34866b">VERIFIED_IMPROVEMENT</text>
    <text x="712" y="206" class="mono" font-size="11.5" fill="#a5a9ad">relief T01 · 40 × 16 mm</text>
    <text x="712" y="224" class="mono" font-size="11.5" fill="#a5a9ad">12/12 mandatory checks</text>
    <text x="712" y="242" class="mono" font-size="11.5" fill="#a5a9ad">removal → target Z+ 80 mm</text>
  </g>

  <text x="28" y="42" class="mono" font-size="13" fill="#7d8287">fixture B02 · the day it breaks</text>
</svg>
