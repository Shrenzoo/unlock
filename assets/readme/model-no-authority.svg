<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" width="100%" role="img"
     aria-label="The model's statements are recorded but carry no authority over any engineering outcome">
  <defs>
    <style>
      .mono{font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace}
      @keyframes slidein{0%{opacity:0;transform:translateX(-14px)}100%{opacity:1;transform:translateX(0)}}
      @keyframes strike{0%{stroke-dashoffset:300}100%{stroke-dashoffset:0}}
      @keyframes rise{0%{opacity:0;transform:translateY(12px)}100%{opacity:1;transform:translateY(0)}}
      @keyframes sweep{0%{opacity:.2}50%{opacity:.75}100%{opacity:.2}}
      .ms{animation:slidein .6s ease-out both}
      .sk{stroke-dasharray:300;animation:strike 1.1s ease-out .5s both}
      .au{animation:rise .7s ease-out .9s both}
      .sw{animation:sweep 3s ease-in-out infinite}
    </style>
  </defs>
  <rect width="960" height="260" fill="#151719"/>
  <text x="40" y="38" class="mono" font-size="13" fill="#3268f5">the sentence that makes this trustworthy</text>

  <!-- what the model says -->
  <g class="ms">
    <rect x="40" y="60" width="420" height="86" rx="10" fill="#1d2023" stroke="#33383d"/>
    <text x="58" y="84" class="mono" font-size="10.5" fill="#7d8287">FINAL MODEL STATEMENT · turn 6</text>
    <text x="58" y="106" class="mono" font-size="11.5" fill="#e9e8e3">{"candidate_proposed": true,</text>
    <text x="58" y="122" class="mono" font-size="11.5" fill="#e9e8e3"> "safe": true, "ready": true}</text>
    <path class="sk" d="M56 96 H420 M56 112 H420" stroke="#e4602f" stroke-width="2"/>
  </g>

  <!-- arrow -->
  <text x="486" y="108" class="mono" font-size="20" fill="#4f5357">→</text>

  <!-- what it actually does -->
  <g class="au">
    <rect x="520" y="60" width="400" height="86" rx="10" fill="#14211c" stroke="#34866b"/>
    <text x="538" y="84" class="mono" font-size="10.5" fill="#34866b">WHAT THAT STATEMENT DOES</text>
    <text x="538" y="106" class="mono" font-size="11.5" fill="#f2f1ed">recorded as a model statement</text>
    <text x="538" y="124" class="mono" font-size="11.5" fill="#f2f1ed">and then ignored</text>
  </g>

  <!-- the four authorities -->
  <g class="au">
    <rect x="40" y="172" width="205" height="60" rx="9" fill="#1d2023" stroke="#33383d"/>
    <text x="56" y="194" class="mono" font-size="11" fill="#34866b">who decides the route</text>
    <text x="56" y="214" class="mono" font-size="10" fill="#a5a9ad">the disassembly planner</text>

    <rect x="265" y="172" width="205" height="60" rx="9" fill="#1d2023" stroke="#33383d"/>
    <text x="281" y="194" class="mono" font-size="11" fill="#34866b">who decides it's safe</text>
    <text x="281" y="214" class="mono" font-size="10" fill="#a5a9ad">the independent verifier</text>

    <rect x="490" y="172" width="205" height="60" rx="9" fill="#1d2023" stroke="#33383d"/>
    <text x="506" y="194" class="mono" font-size="11" fill="#34866b">who builds the geometry</text>
    <text x="506" y="214" class="mono" font-size="10" fill="#a5a9ad">the trusted constructor</text>

    <rect x="715" y="172" width="205" height="60" rx="9" fill="#1d2023" stroke="#33383d"/>
    <text x="731" y="194" class="mono" font-size="11" fill="#34866b">what the UI shows green</text>
    <text x="731" y="214" class="mono" font-size="10" fill="#a5a9ad">provenance, never a claim</text>
  </g>

  <rect class="sw" x="0" y="0" width="960" height="260" fill="none" stroke="#34866b" stroke-width="1" opacity=".2"/>
</svg>
