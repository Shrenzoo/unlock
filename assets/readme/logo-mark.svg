<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="UNLOCK mark: a closed frame opens and the blue square escapes through the gap">
  <defs>
    <style>
      @keyframes gap {
        0%, 12%   { transform: scaleX(0) }
        30%, 74%  { transform: scaleX(1) }
        92%, 100% { transform: scaleX(0) }
      }
      @keyframes rise {
        0%, 20%   { transform: translateY(0) }
        44%, 66%  { transform: translateY(-42px) }
        86%, 100% { transform: translateY(0) }
      }
      @keyframes settle {
        0%, 44%   { transform: scale(1) }
        54%       { transform: scale(1.14) }
        64%, 100% { transform: scale(1) }
      }
      .gapper {
        transform-origin: 60px 46px;
        animation: gap 4.6s cubic-bezier(.65,0,.35,1) infinite;
      }
      .sq {
        transform-origin: 60px 63px;
        animation: rise 4.6s cubic-bezier(.5,0,.2,1) infinite,
                   settle 4.6s ease-out infinite;
      }
    </style>
  </defs>

  <!-- paper tile -->
  <rect width="120" height="120" rx="26" fill="#f2f1ed"/>

  <!-- the frame: a closed black line -->
  <rect x="34" y="46" width="52" height="46" fill="none" stroke="#17191b" stroke-width="7"/>

  <!-- the opening: paper sweeps across the top edge -->
  <rect class="gapper" x="50" y="41" width="20" height="17" fill="#f2f1ed"/>

  <!-- the blue square, which lives inside and then leaves -->
  <rect class="sq" x="52" y="55" width="16" height="16" fill="#3268f5"/>
</svg>
