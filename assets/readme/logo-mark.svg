<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="UNLOCK mark">
  <defs>
    <linearGradient id="mk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3268f5"/>
      <stop offset="1" stop-color="#2253d6"/>
    </linearGradient>
    <style>
      @keyframes shackle { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-7px) } }
      @keyframes glow { 0%,100% { opacity:.35 } 50% { opacity:1 } }
      @keyframes sweep { 0% { stroke-dashoffset: 220 } 100% { stroke-dashoffset: -220 } }
      .sh { animation: shackle 3.6s cubic-bezier(.65,0,.35,1) infinite; transform-origin: 60px 52px; }
      .gl { animation: glow 2.4s ease-in-out infinite; }
      .sw { stroke-dasharray: 110; animation: sweep 3.6s linear infinite; }
    </style>
  </defs>
  <rect width="120" height="120" rx="26" fill="#151719"/>
  <circle class="gl" cx="60" cy="62" r="44" fill="none" stroke="#3268f5" stroke-opacity=".25" stroke-width="1"/>
  <!-- shackle -->
  <g class="sh">
    <path d="M42 52 V40 a18 18 0 0 1 36 0 V52" fill="none" stroke="#f2f1ed" stroke-width="7" stroke-linecap="round"/>
  </g>
  <!-- body -->
  <rect x="34" y="52" width="52" height="40" rx="9" fill="url(#mk)"/>
  <circle cx="60" cy="69" r="6" fill="#151719"/>
  <rect x="57" y="69" width="6" height="13" rx="3" fill="#151719"/>
  <!-- verification sweep -->
  <path class="sw" d="M34 92 h52" fill="none" stroke="#34866b" stroke-width="3" stroke-linecap="round" opacity=".9"/>
</svg>
