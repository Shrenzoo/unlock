<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img"
     aria-label="UNLOCK mark: the closed frame unlatches and the blue square floats up through the opening">
  <defs>
    <style>
      /* the top edge parts at the centre: each arm pulls back to its corner */
      @keyframes unlatch-top {
        0%, 6%    { stroke-dashoffset: 0 }
        24%, 76%  { stroke-dashoffset: 14 }
        94%, 100% { stroke-dashoffset: 0 }
      }
      /* the bottom edge retracts from the centre into the sides and is gone */
      @keyframes unlatch-bottom {
        0%, 6%    { stroke-dashoffset: 0 }
        22%, 78%  { stroke-dashoffset: 100 }
        94%, 100% { stroke-dashoffset: 0 }
      }
      /* the square rises through the gap, overshoots a touch, settles, returns */
      @keyframes float-up {
        0%, 20%   { transform: translateY(0) }
        48%       { transform: translateY(-46px) }
        54%, 60%  { transform: translateY(-44px) }
        86%, 100% { transform: translateY(0) }
      }
      .arm {
        stroke-dasharray: 100 100;
        animation: unlatch-top 4.6s cubic-bezier(.65,0,.35,1) infinite;
      }
      .base {
        stroke-dasharray: 100 100;
        animation: unlatch-bottom 4.6s cubic-bezier(.65,0,.35,1) infinite;
      }
      .sq {
        transform-origin: 60px 65px;
        animation: float-up 4.6s cubic-bezier(.55,0,.25,1) infinite;
      }
    </style>
  </defs>

  <!-- paper tile -->
  <rect width="120" height="120" rx="26" fill="#f2f1ed"/>

  <g fill="none" stroke="#17191b" stroke-width="6.5" stroke-linejoin="miter">
    <!-- left side + top-left arm: one mitered piece, drawn bottom-up -->
    <path class="arm" pathLength="100" d="M28 84V46H60.5"/>
    <!-- right side + top-right arm, mirrored -->
    <path class="arm" pathLength="100" d="M92 84V46H59.5"/>
    <!-- bottom edge in two halves that pull back into the sides -->
    <path class="base" pathLength="100" d="M24.75 84H60.5"/>
    <path class="base" pathLength="100" d="M95.25 84H59.5"/>
  </g>

  <!-- the blue square, held inside, then out through the opening -->
  <rect class="sq" x="52.5" y="57.5" width="15" height="15" fill="#3268f5"/>
</svg>
