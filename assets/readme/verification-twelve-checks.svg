<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" role="img"
     aria-label="Twelve mandatory verification checks all passing, any unknown forbids a pass">
  <defs>
    <style>
      .mono{font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace}
      @keyframes chk {0%{stroke-dashoffset:60;opacity:.15}100%{stroke-dashoffset:0;opacity:1}}
      @keyframes rowin{0%{opacity:0;transform:translateX(-6px)}100%{opacity:1;transform:translateX(0)}}
      @keyframes badge{0%,100%{opacity:.85}50%{opacity:1}}
      .tick{stroke-dasharray:60;animation:chk .7s ease-out forwards}
      .rw{animation:rowin .5s ease-out both}
      .bd{animation:badge 2.6s ease-in-out infinite}
    </style>
  </defs>
  <rect width="960" height="400" fill="#151719"/>

  <text x="40" y="46" class="mono" font-size="13" fill="#34866b">independent verification · candidate cand_eaafba557ae0</text>
  <text x="40" y="68" class="mono" font-size="11" fill="#7d8287">rebuilt from frozen parameters · model-supplied pass flags never accepted</text>

  <!-- 12 checks in 2 columns -->
  <g class="rw" style="animation-delay:.05s"><text x="52" y="112" class="mono" font-size="12" fill="#e9e8e3">integrity</text><path class="tick" d="M244 108 l7 7 l14 -15" fill="none" stroke="#34866b" stroke-width="2.2" style="animation-delay:.1s"/></g>
  <g class="rw" style="animation-delay:.1s"><text x="52" y="142" class="mono" font-size="12" fill="#e9e8e3">solid_validity</text><path class="tick" d="M244 138 l7 7 l14 -15" fill="none" stroke="#34866b" stroke-width="2.2" style="animation-delay:.2s"/></g>
  <g class="rw" style="animation-delay:.15s"><text x="52" y="172" class="mono" font-size="12" fill="#e9e8e3">trusted_reconstruction</text><path class="tick" d="M244 168 l7 7 l14 -15" fill="none" stroke="#34866b" stroke-width="2.2" style="animation-delay:.3s"/></g>
  <g class="rw" style="animation-delay:.2s"><text x="52" y="202" class="mono" font-size="12" fill="#e9e8e3">actual_change</text><path class="tick" d="M244 198 l7 7 l14 -15" fill="none" stroke="#34866b" stroke-width="2.2" style="animation-delay:.4s"/></g>
  <g class="rw" style="animation-delay:.25s"><text x="52" y="232" class="mono" font-size="12" fill="#e9e8e3">protected_interfaces</text><path class="tick" d="M244 228 l7 7 l14 -15" fill="none" stroke="#34866b" stroke-width="2.2" style="animation-delay:.5s"/></g>
  <g class="rw" style="animation-delay:.3s"><text x="52" y="262" class="mono" font-size="12" fill="#e9e8e3">hole_geometry</text><path class="tick" d="M244 258 l7 7 l14 -15" fill="none" stroke="#34866b" stroke-width="2.2" style="animation-delay:.6s"/></g>

  <g class="rw" style="animation-delay:.35s"><text x="360" y="112" class="mono" font-size="12" fill="#e9e8e3">fixed_components</text><path class="tick" d="M572 108 l7 7 l14 -15" fill="none" stroke="#34866b" stroke-width="2.2" style="animation-delay:.7s"/></g>
  <g class="rw" style="animation-delay:.4s"><text x="360" y="142" class="mono" font-size="12" fill="#e9e8e3">placements</text><path class="tick" d="M572 138 l7 7 l14 -15" fill="none" stroke="#34866b" stroke-width="2.2" style="animation-delay:.8s"/></g>
  <g class="rw" style="animation-delay:.45s"><text x="360" y="172" class="mono" font-size="12" fill="#e9e8e3">design_envelope</text><path class="tick" d="M572 168 l7 7 l14 -15" fill="none" stroke="#34866b" stroke-width="2.2" style="animation-delay:.9s"/></g>
  <g class="rw" style="animation-delay:.5s"><text x="360" y="202" class="mono" font-size="12" fill="#e9e8e3">keep_outs</text><path class="tick" d="M572 198 l7 7 l14 -15" fill="none" stroke="#34866b" stroke-width="2.2" style="animation-delay:1s"/></g>
  <g class="rw" style="animation-delay:.55s"><text x="360" y="232" class="mono" font-size="12" fill="#e9e8e3">assembled_intersections</text><path class="tick" d="M572 228 l7 7 l14 -15" fill="none" stroke="#34866b" stroke-width="2.2" style="animation-delay:1.1s"/></g>
  <g class="rw" style="animation-delay:.6s"><text x="360" y="262" class="mono" font-size="12" fill="#e9e8e3">tool_access <tspan fill="#7d8287">(via replay)</tspan></text><path class="tick" d="M572 258 l7 7 l14 -15" fill="none" stroke="#34866b" stroke-width="2.2" style="animation-delay:1.2s"/></g>

  <!-- the rule -->
  <rect x="640" y="92" width="284" height="184" rx="11" fill="#1d2023" stroke="#33383d"/>
  <text x="660" y="112" class="mono" font-size="11" fill="#e4602f">THE AGGREGATION RULE</text>
  <text x="660" y="140" class="mono" font-size="11" fill="#a5a9ad">clear · blocked · unknown are</text>
  <text x="660" y="158" class="mono" font-size="11" fill="#a5a9ad">kept separate, never merged.</text>
  <text x="660" y="186" class="mono" font-size="11" fill="#f2f1ed">A mandatory check that is</text>
  <text x="660" y="204" class="mono" font-size="11" fill="#f2f1ed">unknown, missing or stale</text>
  <text x="660" y="222" class="mono" font-size="11" fill="#e4602f">forbids a passing aggregate.</text>
  <text x="660" y="250" class="mono" font-size="10" fill="#4f5357">witness sampling can reject or</text>
  <text x="660" y="264" class="mono" font-size="10" fill="#4f5357">leave unknown — never admit.</text>

  <!-- footer -->
  <rect class="bd" x="40" y="316" width="884" height="52" rx="10" fill="#14211c" stroke="#34866b"/>
  <text x="60" y="340" class="mono" font-size="12.5" fill="#34866b">RESULT: 12 / 12 mandatory checks passed</text>
  <text x="60" y="358" class="mono" font-size="10.5" fill="#a5a9ad">no failed · no unknown · no missing · no stale — then replay and reverse insertion, then comparison</text>
</svg>
