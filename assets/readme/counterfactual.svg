<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="100%" role="img"
     aria-label="The same run with and without a verification boundary: identical proposal, opposite trustworthiness">
  <defs>
    <style>
      .mono{font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace}
      @keyframes split{0%{stroke-dashoffset:0}100%{stroke-dashoffset:-40}}
      @keyframes leftin{0%{opacity:0;transform:translateX(-10px)}100%{opacity:1;transform:translateX(0)}}
      @keyframes rightin{0%{opacity:0;transform:translateX(10px)}100%{opacity:1;transform:translateX(0)}}
      @keyframes warn{0%,100%{stroke-opacity:.35}50%{stroke-opacity:1}}
      @keyframes ok{0%,100%{stroke-opacity:.5}50%{stroke-opacity:1}}
      .spl{stroke-dasharray:6 6;animation:split 4s linear infinite}
      .l{animation:leftin .6s ease-out both}
      .r{animation:rightin .6s ease-out both}
      .wn{animation:warn 2.6s ease-in-out infinite}
      .ok{animation:ok 2.6s ease-in-out infinite}
    </style>
  </defs>
  <rect width="960" height="340" fill="#151719"/>

  <text x="480" y="38" class="mono" font-size="13" fill="#3268f5" text-anchor="middle">the same model, the same fixture, the same proposal — one boundary away from worthless</text>

  <!-- divider -->
  <line class="spl" x1="480" y1="60" x2="480" y2="316" stroke="#4f5357" stroke-width="1.5" fill="none"/>

  <!-- LEFT: no boundary -->
  <g class="l">
    <text x="40" y="72" class="mono" font-size="12" fill="#e4602f">WITHOUT THE BOUNDARY</text>
    <rect x="40" y="86" width="410" height="60" rx="9" fill="#1d2023" stroke="#33383d"/>
    <text x="58" y="110" class="mono" font-size="11.5" fill="#e9e8e3">model proposes T01 40 × 16</text>
    <text x="58" y="130" class="mono" font-size="10" fill="#7d8287">"verified, safe, ready to cut"</text>

    <path d="M245 146 V172" stroke="#e4602f" stroke-width="1.5"/>

    <rect x="40" y="172" width="410" height="60" rx="9" fill="#2a1a14" stroke="#e4602f" class="wn"/>
    <text x="58" y="196" class="mono" font-size="11" fill="#e4602f">shipped to a machinist</text>
    <text x="58" y="216" class="mono" font-size="10" fill="#a5a9ad">nothing checked it against the actual solids</text>

    <text x="40" y="262" class="mono" font-size="10.5" fill="#7d8287">Possible outcomes, none of them knowable in advance:</text>
    <text x="40" y="280" class="mono" font-size="10" fill="#a5a9ad">• severs a load path   • eats a mounting pad</text>
    <text x="40" y="296" class="mono" font-size="10" fill="#a5a9ad">• violates a keep-out  • still doesn't clear the bracket</text>
    <text x="40" y="320" class="mono" font-size="10" fill="#e4602f">cost of being wrong: a scrapped enclosure, or worse</text>
  </g>

  <!-- RIGHT: with boundary -->
  <g class="r">
    <text x="520" y="72" class="mono" font-size="12" fill="#34866b">WITH THE BOUNDARY</text>
    <rect x="520" y="86" width="400" height="60" rx="9" fill="#1d2023" stroke="#33383d"/>
    <text x="538" y="110" class="mono" font-size="11.5" fill="#e9e8e3">model proposes T01 40 × 16</text>
    <text x="538" y="130" class="mono" font-size="10" fill="#7d8287">"verified, safe, ready to cut"</text>

    <path d="M720 146 V172" stroke="#4f5357" stroke-width="1.5" stroke-dasharray="4 4"/>

    <rect x="520" y="172" width="400" height="60" rx="9" fill="#14211c" stroke="#34866b" class="ok"/>
    <text x="538" y="196" class="mono" font-size="11" fill="#34866b">kernel rebuilds from frozen parameters</text>
    <text x="538" y="216" class="mono" font-size="10" fill="#a5a9ad">two-way B-rep difference · twelve mandatory checks</text>

    <text x="520" y="262" class="mono" font-size="10.5" fill="#7d8287">What is actually established:</text>
    <text x="520" y="280" class="mono" font-size="10" fill="#a5a9ad">• 2,560 mm³ removed, 0 mm³ outside the web</text>
    <text x="520" y="296" class="mono" font-size="10" fill="#a5a9ad">• route Z+ 80 mm · forward replay ✓ · reverse ✓</text>
    <text x="520" y="320" class="mono" font-size="10" fill="#34866b">cost of being wrong: refused before construction starts</text>
  </g>
</svg>
