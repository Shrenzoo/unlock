<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="100%" role="img"
     aria-label="System architecture stack from React workspace down to the OCCT kernel, with the model above the trust boundary">
  <defs>
    <linearGradient id="abg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151719"/><stop offset="1" stop-color="#1d2023"/>
    </linearGradient>
    <style>
      .mono{font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace}
      @keyframes rise{0%{opacity:0;transform:translateY(10px)}100%{opacity:1;transform:translateY(0)}}
      @keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
      .ly{animation:rise .55s ease-out both}
      .pl{animation:pulse 3s ease-in-out infinite}
    </style>
  </defs>
  <rect width="960" height="420" fill="url(#abg)"/>

  <text x="40" y="36" class="mono" font-size="13" fill="#3268f5">architecture · every layer is swappable, none of them trust each other</text>

  <!-- layer 1: model -->
  <g class="ly" style="animation-delay:.05s">
    <rect x="40" y="56" width="540" height="46" rx="9" fill="#1a2233" stroke="#3268f5" stroke-opacity=".6"/>
    <text x="56" y="74" class="mono" font-size="12" fill="#3268f5">Muse Spark 1.3 · Meta Model API</text>
    <text x="56" y="90" class="mono" font-size="10" fill="#7d8287">Chat Completions · tool_choice=auto · max_completion_tokens · bounded retries</text>
    <rect x="600" y="56" width="320" height="46" rx="9" fill="#1d2023" stroke="#33383d"/>
    <text x="616" y="74" class="mono" font-size="11" fill="#a5a9ad">8 allowlisted tools only</text>
    <text x="616" y="90" class="mono" font-size="10" fill="#7d8287">no shell · no python · no url · no fs</text>
  </g>

  <line class="pl" x1="40" y1="118" x2="920" y2="118" stroke="#e4602f" stroke-width="1.5" stroke-dasharray="6 6"/>
  <text x="40" y="136" class="mono" font-size="10.5" fill="#e4602f">▲ untrusted proposer above ▼ trusted authority below</text>

  <!-- layer 2: controller -->
  <g class="ly" style="animation-delay:.15s">
    <rect x="40" y="148" width="880" height="46" rx="9" fill="#1d2023" stroke="#33383d"/>
    <text x="56" y="166" class="mono" font-size="12" fill="#e9e8e3">AI controller · 3 candidates · 12 tool calls · 6 turns · 16,000 output tokens · 120 s</text>
    <text x="56" y="182" class="mono" font-size="10" fill="#7d8287">output reserved before every attempt · one schema repair · plain text never becomes a tool call</text>
  </g>

  <!-- layer 3: fastapi -->
  <g class="ly" style="animation-delay:.25s">
    <rect x="40" y="204" width="880" height="46" rx="9" fill="#1d2023" stroke="#33383d"/>
    <text x="56" y="222" class="mono" font-size="12" fill="#e9e8e3">FastAPI coordinator · immutable revisions · frozen targets · ordered resumable SSE · cancellation</text>
    <text x="56" y="238" class="mono" font-size="10" fill="#7d8287">SQLite with foreign keys · one serial queue · credentials stripped from every worker environment</text>
  </g>

  <!-- layer 4: services -->
  <g class="ly" style="animation-delay:.35s">
    <rect x="40" y="260" width="280" height="46" rx="9" fill="#14211c" stroke="#34866b" stroke-opacity=".6"/>
    <text x="56" y="278" class="mono" font-size="11.5" fill="#34866b">disassembly planner</text>
    <text x="56" y="294" class="mono" font-size="10" fill="#7d8287">conservative coverage + analytic sweep</text>
    <rect x="340" y="260" width="280" height="46" rx="9" fill="#14211c" stroke="#34866b" stroke-opacity=".6"/>
    <text x="356" y="278" class="mono" font-size="11.5" fill="#34866b">independent verifier</text>
    <text x="356" y="294" class="mono" font-size="10" fill="#7d8287">fresh reconstruction · 12 checks</text>
    <rect x="640" y="260" width="280" height="46" rx="9" fill="#14211c" stroke="#34866b" stroke-opacity=".6"/>
    <text x="656" y="278" class="mono" font-size="11.5" fill="#34866b">template constructors</text>
    <text x="656" y="294" class="mono" font-size="10" fill="#7d8287">T01/T02 · finite server grids</text>
  </g>

  <!-- layer 5: kernel -->
  <g class="ly" style="animation-delay:.45s">
    <rect x="40" y="316" width="880" height="52" rx="9" fill="#272b2f" stroke="#4f5357"/>
    <text x="56" y="336" class="mono" font-size="12" fill="#f2f1ed">OCCT / CadQuery kernel · real BReps · private deep copies at every mutation boundary</text>
    <text x="56" y="354" class="mono" font-size="10" fill="#a5a9ad">isolated native subprocesses · 30 s wall limit · 120 s parent budget · STEP round-trip reimport on export</text>
  </g>

  <text x="40" y="398" class="mono" font-size="10.5" fill="#4f5357">Frontend renders what a report says. It never derives a verification status of its own.</text>
</svg>
