<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="100%" role="img"
     aria-label="Muse's first proposal, a geometrically valid 24 by 12 relief, is refused for citing the wrong kind of evidence; it resubmits a larger 40 by 16 relief with a correct citation and is constructed">
  <defs>
    <style>
      .mono{font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace}
      @keyframes msg  {0%,4%{opacity:0;transform:translateY(8px)}10%,100%{opacity:1;transform:translateY(0)}}
      @keyframes refuse{0%,44%{opacity:0}50%,90%{opacity:1}100%{opacity:1}}
      @keyframes flash {0%,42%{stroke:#7d8287}48%,60%{stroke:#e4602f}70%,100%{stroke:#34866b}}
      @keyframes strikethrough{0%,44%{stroke-dashoffset:290}56%,100%{stroke-dashoffset:0}}
      @keyframes retry{0%,64%{opacity:0;transform:translateY(8px)}72%,100%{opacity:1;transform:translateY(0)}}
      .m1{animation:msg 8s ease-out infinite}
      .r1{animation:refuse 8s linear infinite}
      .box{animation:flash 8s linear infinite}
      .strk{stroke-dasharray:290;animation:strikethrough 8s ease-out infinite}
      .m2{animation:retry 8s ease-out infinite}
    </style>
  </defs>
  <rect width="960" height="300" fill="#151719"/>
  <rect x="0" y="0" width="960" height="300" fill="none"/>

  <!-- turn 1 -->
  <g class="m1">
    <rect x="40" y="34" width="420" height="62" rx="9" fill="#1d2023" stroke="#33383d"/>
    <text x="56" y="56" class="mono" font-size="10.5" fill="#3268f5">MUSE · turn 2</text>
    <text x="56" y="76" class="mono" font-size="12" fill="#e9e8e3">construct_candidate T01 24 × 12</text>
    <text x="300" y="76" class="mono" font-size="9.5" fill="#34866b">← geometry was valid</text>
    <text x="56" y="90" class="mono" font-size="10.5" fill="#7d8287">evidence_ids: ["ev_83077a556f31", "ev_afa690947095"]</text>
  </g>
  <!-- strike through the bad citation -->
  <path class="strk" d="M56 92 H346" stroke="#e4602f" stroke-width="2"/>

  <!-- the refusal -->
  <g class="r1">
    <rect x="492" y="34" width="428" height="62" rx="9" fill="#2a1a14" stroke="#e4602f"/>
    <text x="508" y="56" class="mono" font-size="10.5" fill="#e4602f">DISPATCHER · REFUSED</text>
    <text x="508" y="75" class="mono" font-size="11.5" fill="#f2f1ed">INVALID_PROPOSAL · construction never started</text>
    <text x="508" y="90" class="mono" font-size="10" fill="#a5a9ad">"cite at least one rejection, plan or verification evidence ID"</text>
  </g>

  <!-- the gate box framing both -->
  <rect class="box" x="26" y="18" width="908" height="96" rx="13" fill="none" stroke-width="1.5"/>

  <!-- turn 3 -->
  <g class="m2">
    <rect x="40" y="150" width="420" height="62" rx="9" fill="#1d2023" stroke="#34866b"/>
    <text x="56" y="172" class="mono" font-size="10.5" fill="#34866b">MUSE · turn 3 — resubmit, "larger cut"</text>
    <text x="56" y="192" class="mono" font-size="12" fill="#e9e8e3">construct_candidate T01 40 × 16</text>
    <text x="56" y="206" class="mono" font-size="10.5" fill="#34866b">evidence_ids: ["rej_17a84dbaf811", +2 ev_] ✓</text>

    <rect x="492" y="150" width="428" height="62" rx="9" fill="#14211c" stroke="#34866b"/>
    <text x="508" y="172" class="mono" font-size="10.5" fill="#34866b">DISPATCHER · ACCEPTED</text>
    <text x="508" y="191" class="mono" font-size="11.5" fill="#f2f1ed">cand_eaafba557ae0</text>
    <text x="508" y="206" class="mono" font-size="10" fill="#a5a9ad">2,560 mm³ removed · inside editable web · 0 mm³ outside</text>
  </g>

  <text x="40" y="252" class="mono" font-size="11" fill="#7d8287">The refusal was about citations, not geometry, but the message did not say so. The model answered</text>
  <text x="40" y="270" class="mono" font-size="11" fill="#7d8287">with a cut 2.2× larger. The message now adds: "the same parameters are allowed" (fffc1e4).</text>
  <text x="40" y="288" class="mono" font-size="10" fill="#4f5357">recorded live · evidence/live-b02/live_run.json · t = 25.4 s → 34.4 s</text>
</svg>
