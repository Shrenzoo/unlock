<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 260" width="100%" role="img"
     aria-label="Seven-stage pipeline from inspect to compare, with the model and the geometry kernel on separate sides of a trust boundary">
  <defs>
    <linearGradient id="pbg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#151719"/><stop offset="1" stop-color="#1d2023"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3268f5" stop-opacity=".1"/>
      <stop offset=".5" stop-color="#3268f5"/>
      <stop offset="1" stop-color="#3268f5" stop-opacity=".1"/>
    </linearGradient>
    <style>
      .mono{font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace}
      @keyframes run { 0%{stroke-dashoffset:600} 100%{stroke-dashoffset:0} }
      @keyframes tick{ 0%,8%{opacity:.25} 12%,18%{opacity:1} 26%,100%{opacity:.25} }
      @keyframes gate{ 0%,100%{stroke-opacity:.35} 50%{stroke-opacity:1} }
      .spine{ stroke-dasharray:14 10; animation: run 4s linear infinite }
      .stg{ animation: tick 4s linear infinite }
      .stg:nth-of-type(2){animation-delay:.5s} .stg:nth-of-type(3){animation-delay:1s}
      .stg:nth-of-type(4){animation-delay:1.5s} .stg:nth-of-type(5){animation-delay:2s}
      .stg:nth-of-type(6){animation-delay:2.5s} .stg:nth-of-type(7){animation-delay:3s}
      .bound{ animation: gate 3s ease-in-out infinite }
    </style>
  </defs>
  <rect width="980" height="260" fill="url(#pbg)"/>

  <!-- the trust boundary -->
  <line class="bound" x1="676" y1="26" x2="676" y2="234" stroke="#e4602f" stroke-width="1.5" stroke-dasharray="5 6"/>
  <text x="686" y="40" class="mono" font-size="11" fill="#e4602f">TRUST BOUNDARY</text>
  <text x="686" y="56" class="mono" font-size="10" fill="#7d8287">model cannot cross</text>

  <!-- spine -->
  <line class="spine" x1="60" y1="130" x2="920" y2="130" stroke="url(#flow)" stroke-width="2.5"/>

  <!-- stages -->
  <g class="stg"><circle cx="90"  cy="130" r="15" fill="#151719" stroke="#3268f5" stroke-width="2"/><text x="90" y="135" class="mono" font-size="10" fill="#3268f5" text-anchor="middle">01</text><text x="90" y="172" class="mono" font-size="10.5" fill="#a5a9ad" text-anchor="middle">inspect</text></g>
  <g class="stg"><circle cx="218" cy="130" r="15" fill="#151719" stroke="#3268f5" stroke-width="2"/><text x="218" y="135" class="mono" font-size="10" fill="#3268f5" text-anchor="middle">02</text><text x="218" y="172" class="mono" font-size="10.5" fill="#a5a9ad" text-anchor="middle">baseline</text></g>
  <g class="stg"><circle cx="346" cy="130" r="15" fill="#151719" stroke="#3268f5" stroke-width="2"/><text x="346" y="135" class="mono" font-size="10" fill="#3268f5" text-anchor="middle">03</text><text x="346" y="172" class="mono" font-size="10.5" fill="#a5a9ad" text-anchor="middle">obstruction</text></g>
  <g class="stg"><circle cx="474" cy="130" r="15" fill="#151719" stroke="#3268f5" stroke-width="2"/><text x="474" y="135" class="mono" font-size="10" fill="#3268f5" text-anchor="middle">04</text><text x="474" y="172" class="mono" font-size="10.5" fill="#a5a9ad" text-anchor="middle">interventions</text></g>
  <g class="stg"><circle cx="602" cy="130" r="15" fill="#151719" stroke="#3268f5" stroke-width="2"/><text x="602" y="135" class="mono" font-size="10" fill="#3268f5" text-anchor="middle">05</text><text x="602" y="172" class="mono" font-size="10.5" fill="#a5a9ad" text-anchor="middle">construct</text></g>
  <g class="stg"><circle cx="762" cy="130" r="15" fill="#151719" stroke="#34866b" stroke-width="2"/><text x="762" y="135" class="mono" font-size="10" fill="#34866b" text-anchor="middle">06</text><text x="762" y="172" class="mono" font-size="10.5" fill="#34866b" text-anchor="middle">verify</text></g>
  <g class="stg"><circle cx="890" cy="130" r="15" fill="#151719" stroke="#34866b" stroke-width="2"/><text x="890" y="135" class="mono" font-size="10" fill="#34866b" text-anchor="middle">07</text><text x="890" y="172" class="mono" font-size="10.5" fill="#34866b" text-anchor="middle">compare</text></g>

  <!-- side labels -->
  <text x="60" y="60" class="mono" font-size="11" fill="#7d8287">◀  Muse Spark 1.3 proposes  ▶</text>
  <text x="700" y="228" class="mono" font-size="11" fill="#34866b">◀  OCCT kernel disposes  ▶</text>

  <text x="60" y="212" class="mono" font-size="10" fill="#4f5357">stages 01–05 · evidence gathering + bounded proposal</text>
  <text x="700" y="196" class="mono" font-size="10" fill="#4f5357">independent reconstruction ·</text>
  <text x="700" y="210" class="mono" font-size="10" fill="#4f5357">no model flags accepted</text>
</svg>
