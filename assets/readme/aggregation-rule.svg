<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="100%" role="img"
     aria-label="Three separate statuses: clear admits, blocked refuses, unknown forbids a passing aggregate">
  <defs>
    <style>
      .mono{font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace}
      @keyframes flow{0%{stroke-dashoffset:200}100%{stroke-dashoffset:0}}
      @keyframes fadeup{0%{opacity:0;transform:translateY(10px)}100%{opacity:1;transform:translateY(0)}}
      @keyframes blockpulse{0%,100%{stroke-opacity:.4}50%{stroke-opacity:1}}
      @keyframes haltpulse{0%,100%{box-shadow:0 0 0 0 rgba(228,96,47,0)}50%{box-shadow:0 0 0 6px rgba(228,96,47,.25)}}
      @keyframes dashrun{0%{stroke-dashoffset:0}100%{stroke-dashoffset:-60}}
      .fl{stroke-dasharray:200;animation:flow 2.4s ease-in-out infinite}
      .fu{animation:fadeup .55s ease-out both}
      .bp{animation:blockpulse 2.4s ease-in-out infinite}
      .dr{stroke-dasharray:6 6;animation:dashrun 3s linear infinite}
    </style>
  </defs>
  <rect width="960" height="320" fill="#151719"/>
  <text x="40" y="40" class="mono" font-size="13" fill="#3268f5">three results, kept separate — never merged into one boolean</text>

  <!-- CLEAR -->
  <g class="fu" style="animation-delay:.1s">
    <rect x="40" y="72" width="270" height="118" rx="11" fill="#14211c" stroke="#34866b"/>
    <text x="60" y="100" class="mono" font-size="12.5" fill="#34866b">clear</text>
    <text x="60" y="124" class="mono" font-size="10.5" fill="#a5a9ad">validated conservative coverage</text>
    <text x="60" y="140" class="mono" font-size="10.5" fill="#a5a9ad">plus complete analytic sweep</text>
    <text x="60" y="164" class="mono" font-size="11" fill="#f2f1ed">→ the translation is admitted</text>
  </g>
  <path class="fl" d="M175 190 V232" stroke="#34866b" stroke-width="2" fill="none"/>
  <path d="M169 226 l6 10 l6 -10" fill="none" stroke="#34866b" stroke-width="2"/>

  <!-- BLOCKED -->
  <g class="fu" style="animation-delay:.25s">
    <rect x="345" y="72" width="270" height="118" rx="11" fill="#2a1a14" stroke="#e4602f"/>
    <text x="365" y="100" class="mono" font-size="12.5" fill="#e4602f">blocked</text>
    <text x="365" y="124" class="mono" font-size="10.5" fill="#a5a9ad">obstruction proven, with a</text>
    <text x="365" y="140" class="mono" font-size="10.5" fill="#a5a9ad">BRep witness at real coordinates</text>
    <text x="365" y="164" class="mono" font-size="11" fill="#f2f1ed">→ refused, with evidence</text>
  </g>
  <path class="fl" d="M480 190 V232" stroke="#e4602f" stroke-width="2" fill="none"/>
  <path d="M474 226 l6 10 l6 -10" fill="none" stroke="#e4602f" stroke-width="2"/>

  <!-- UNKNOWN -->
  <g class="fu" style="animation-delay:.4s">
    <rect x="650" y="72" width="270" height="118" rx="11" fill="#1d2023" stroke="#4f5357"/>
    <text x="670" y="100" class="mono" font-size="12.5" fill="#e9e8e3">unknown</text>
    <text x="670" y="124" class="mono" font-size="10.5" fill="#a5a9ad">coverage incomplete, separation</text>
    <text x="670" y="140" class="mono" font-size="10.5" fill="#a5a9ad">unproven, or a check is stale</text>
    <text x="670" y="164" class="mono" font-size="11" fill="#e4602f">→ nothing admitted AND…</text>
  </g>
  <path class="dr" d="M786 190 V232" stroke="#4f5357" stroke-width="2" fill="none"/>

  <!-- the aggregation gate -->
  <g class="fu" style="animation-delay:.6s">
    <rect x="40" y="240" width="880" height="58" rx="11" fill="#1d2023" stroke="#e4602f" class="bp" stroke-width="1.5"/>
    <text x="62" y="264" class="mono" font-size="11.5" fill="#e4602f">THE AGGREGATION GATE</text>
    <text x="62" y="284" class="mono" font-size="11" fill="#f2f1ed">a mandatory check that is unknown, missing or stale <tspan fill="#e4602f">forbids a passing aggregate</tspan> — there is no partial-credit path to green</text>
  </g>

  <text x="40" y="222" class="mono" font-size="10" fill="#4f5357">witness sampling may reject or leave unknown. it may never admit.</text>
</svg>
